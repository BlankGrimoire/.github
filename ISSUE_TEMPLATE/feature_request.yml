name: ✨ Feature request
description: Suggest an idea or improvement for BlankGrimoire.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion!
        ❌ Requests to support **specific websites** will be closed.
        ✅ Requests for new **themes, frameworks or extraction strategies** are welcome.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - iOS app
        - SDK
        - Theme adapter (new theme or framework)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups or synthetic examples. Do not include real domains or copyrighted content.

  - type: checkboxes
    id: rules
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request does not concern a specific website.
          required: true